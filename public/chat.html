<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mobile Chat</title>
  <style>
    :root {
      --safe-bottom: max(8px, env(safe-area-inset-bottom));
      --input-height: 54px;
      --keyboard-offset: 0px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      height: 100dvh;
      overscroll-behavior: none;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      background: #ffffff;
    }

    #chatBox {
      position: absolute;
      left: 0;
      right: 0;
      top: 46px;
      bottom: calc(var(--input-height) + var(--safe-bottom) + 14px + var(--keyboard-offset));
      overflow-y: auto;
      padding: 18px 12px 16px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .message .sender {
      font-size: 11px;
      color: #667085;
      margin: 0 4px 4px;
      line-height: 1.2;
    }

    .message .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      background: #eef3ff;
      word-break: break-word;
      line-height: 1.45;
      font-size: 15px;
    }

    .message.me {
      margin-left: auto;
    }

    .message.me .bubble {
      background: #dff7e8;
    }

    #inputArea {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(var(--safe-bottom) + var(--keyboard-offset));
      display: flex;
      gap: 8px;
      padding: 8px 10px calc(var(--safe-bottom) + 8px);
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid #e7ebf3;
      backdrop-filter: blur(2px);
      z-index: 10;
    }

    #inputField {
      flex: 1;
      height: var(--input-height);
      border: 1px solid #d5ddeb;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 16px;
      outline: none;
      min-width: 0;
    }

    #submitButton {
      width: 78px;
      height: var(--input-height);
      border: none;
      border-radius: 10px;
      background: #2d6cdf;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    #backButton {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 30;
    }

    #backButton button {
      width: 78px;
      height: 34px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="backButton">
      <button onclick="goBack()">Back</button>
    </div>

    <div id="chatBox"></div>

    <form id="chatForm" style="display: contents;">
      <div id="inputArea">
        <input
          type="text"
          id="inputField"
          placeholder="메시지를 입력하세요"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="message input"
        />
        <button type="submit" id="submitButton">전송</button>
      </div>
    </form>
  </div>

  <script src="./chat.js"></script>
</body>
</html>
